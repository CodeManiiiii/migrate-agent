[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "migrate-agent"
version = "0.1.0"
description = "Move coding agent conversations, instructions and skills between clients"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
codex = ["zstandard>=0.22", "tomli>=2; python_version < '3.11'"]

[project.scripts]
migrate-agent = "migrate_agent.cli:main"

[tool.setuptools.packages.find]
include = ["migrate_agent*"]
